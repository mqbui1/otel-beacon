# Astronomy Shop topology — maps simulator roles to actual astronomy-shop service names.
# environment matches the demo deployment so simulated traces appear alongside
# real traffic in the same environment filter.

environment: astronomyshop

services:
  frontend:
    name: frontend-proxy
    language: go
    version: "1.0.0"
    hosts: [frontend-proxy-1]

  api-gateway:
    name: frontend-proxy
    language: go
    version: "1.0.0"
    hosts: [frontend-proxy-1]

  order-service:
    name: checkout
    language: go
    version: "1.0.0"
    hosts: [checkout-1]

  user-service:
    name: recommendation
    language: python
    version: "1.0.0"
    hosts: [recommendation-1]

  product-service:
    name: product-catalog
    language: go
    version: "1.0.0"
    hosts: [product-catalog-1]

  payment-service:
    name: payment
    language: nodejs
    version: "1.0.0"
    hosts: [payment-1]

  postgres:
    name: postgresql
    language: sql
    version: "14.0"
    hosts: [postgresql-1]

  redis:
    name: valkey-cart
    language: redis
    version: "7.2"
    hosts: [valkey-cart-1]

  stripe-api:
    name: accounting
    language: go
    version: "1.0.0"
    hosts: [accounting-1]

scenario_overrides:
  db_slowdown:
    root_endpoint: "POST /api/checkout"
    slow_query: "SELECT * FROM users WHERE session_id = ? ORDER BY created_at"
    slow_table: "users"

  cache_miss_storm:
    root_endpoint: "GET /api/products"

  payment_timeout:
    external_endpoint: "https://api.openai.com/v1/chat/completions"
    affected_region: "us-east-1"

  error_cascade:
    root_endpoint: "GET /api/recommendations"

  latency_spike:
    root_endpoint: "POST /api/checkout"

  oom_crash:
    root_endpoint: "GET /api/products"

  cascading_failure:
    root_endpoint: "POST /api/checkout"

  new_error_sig:
    root_endpoint: "GET /api/recommendations"

  span_drop:
    root_endpoint: "POST /api/checkout"

  kill_service:
    root_endpoint: "POST /api/checkout"
